<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Prokat Erofei - Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- ========================================================================= -->
    <!-- ========================= ЧАСТЬ 2: CSS СТИЛИ ============================ -->
    <!-- ========================================================================= -->
    <style>
        :root {
            --primary: #3b82f6; --bg: #f3f4f6; --surface: #ffffff;
            --dark-card: #1e1e1e; --text-on-dark: #f3f4f6; --text: #0f172a; 
            --danger: #ef4444; --success: #22c55e; --warning: #facc15;
            --repair-bg: #fef08a; --repair-border: #eab308;
            --deleted-text: #94a3b8;
        }
        html { overscroll-behavior: none; }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Стили для модальных окон --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            width: 90%; max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .hidden { display: none !important; }

        /* --- Стили элементов интерфейса --- */
        .input-group { margin-bottom: 1.2rem; }
        .input-group input { 
            width: 100%; padding: 0.8rem; border: 1px solid #ccc; 
            border-radius: 6px; font-size: 1rem; box-sizing: border-box;
        }
        .btn { 
            background: var(--primary); color: white; padding: 0.8rem 1.5rem; 
            border: none; border-radius: 6px; cursor: pointer; width: 100%; 
            font-size: 1rem; font-weight: bold; transition: opacity 0.2s;
        }
        .btn:active, .btn:hover { opacity: 0.8; }
        .btn-danger { background: var(--danger); }
        #errBox { color: var(--danger); margin-bottom: 1rem; text-align: center; font-size: 0.9rem; }

        /* --- Стили для страницы и настроек --- */
        header { background: var(--surface); padding: 1rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .container { padding: 2rem; flex: 1; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .settings-card { background: var(--surface); padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .user-info { margin-top: 1rem; padding: 1rem; background: var(--bg); border-radius: 8px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

    <!-- ========================================================================= -->
    <!-- ========================= ОКНО АВТОРИЗАЦИИ ============================== -->
    <!-- ========================================================================= -->
    <!-- ВАЖНО: Убраны все кнопки закрытия. Скрывается только скриптом -->
    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="text-align: center; margin-top: 0; margin-bottom: 1.5rem;">Вход в систему</h2>
            
            <div id="errBox" style="display:none;"></div>
            
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="password" id="passInput" placeholder="Пароль">
            </div>
            
            <button id="loginBtn" class="btn" onclick="login()">Войти</button>
        </div>
    </div>


    <!-- ========================================================================= -->
    <!-- ========================= ОСНОВНОЙ ИНТЕРФЕЙС ============================ -->
    <!-- ========================================================================= -->
    <header>
        <h1 style="margin: 0; font-size: 1.5rem; color: var(--primary);">Prokat Erofei <span style="color: var(--text); font-size: 1rem; font-weight: normal;">| Админ-панель</span></h1>
    </header>

    <div class="container">
        <!-- Блок настроек с информацией о профиле -->
        <div class="settings-card" id="settingsSection">
            <h2 style="margin-top: 0;"><i class="fas fa-cog"></i> Настройки</h2>
            
            <div class="user-info">
                <p style="margin: 0 0 0.5rem 0; color: #6b7280; font-size: 0.9rem;">Текущий профиль:</p>
                <p id="currentUserDisplay" style="margin: 0 0 1rem 0; font-size: 1.1rem; font-weight: bold;">Загрузка...</p>
                
                <!-- Кнопка выхода -->
                <button class="btn btn-danger" onclick="logout()" style="width: auto;">
                    <i class="fas fa-sign-out-alt"></i> Выйти из профиля
                </button>
            </div>
        </div>
    </div>


    <!-- ========================================================================= -->
    <!-- ========================= ЧАСТЬ 3: JAVASCRIPT =========================== -->
    <!-- ========================================================================= -->
    <script type="module">
        // 1. Импорты Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 2. Инициализация (используем конфиг окружения или тестовый)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            projectId: "test-app", // Заглушка, замените на ваш конфиг если запускаете локально
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ГЛОБАЛЬНЫЙ КЛИК (Игнорируем authModal при клике на фон) ---
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                // Если кликнули на фон окна авторизации - НИЧЕГО НЕ ДЕЛАЕМ (Окно не закроется)
                if (event.target.id === 'authModal') {
                    return; 
                }
                // Для всех остальных модальных окон (если они у вас есть) - закрываем их
                event.target.classList.add('hidden');
            }
        };

        // --- ОТСЛЕЖИВАНИЕ СТАТУСА (Отвечает за показ окна и данные в настройках) ---
        onAuthStateChanged(auth, (user) => {
            const authModal = document.getElementById('authModal');
            const userDisplay = document.getElementById('currentUserDisplay');
            
            if (user) {
                // Пользователь авторизован -> Скрываем окно авторизации
                authModal.classList.add('hidden');
                
                // Обновляем данные в настройках
                if (userDisplay) {
                    userDisplay.innerText = user.email || "Анонимный администратор";
                    userDisplay.style.color = "var(--success)";
                }
            } else {
                // Пользователь НЕ авторизован -> Показываем окно
                authModal.classList.remove('hidden');
                
                // Сбрасываем данные в настройках
                if (userDisplay) {
                    userDisplay.innerText = "Не авторизован";
                    userDisplay.style.color = "var(--danger)";
                }
            }
        });

        // --- ФУНКЦИЯ ВХОДА ---
        window.login = function() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('errBox');

            if (!email || !pass) {
                errBox.innerText = "Введите Email и пароль!"; 
                errBox.style.display = 'block'; 
                return; 
            }

            btn.innerText = "Загрузка..."; 
            errBox.style.display = 'none';

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => { 
                    btn.innerText = "Войти"; 
                    // МЫ НЕ ЗАКРЫВАЕМ ОКНО ЗДЕСЬ ВРУЧНУЮ.
                    // onAuthStateChanged сработает автоматически и надежно скроет окно.
                })
                .catch((error) => {
                    btn.innerText = "Войти";
                    errBox.innerText = "Ошибка: неверный логин или пароль"; 
                    errBox.style.display = 'block';
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                });
        };

        // --- ФУНКЦИЯ ВЫХОДА ИЗ ПРОФИЛЯ ---
        window.logout = function() {
            signOut(auth).then(() => {
                console.log("Успешный выход из системы");
                // Очищаем поля ввода на всякий случай
                document.getElementById('emailInput').value = '';
                document.getElementById('passInput').value = '';
                document.getElementById('errBox').style.display = 'none';
                
                // onAuthStateChanged автоматически покажет окно авторизации
            }).catch((error) => {
                console.error("Ошибка при выходе: ", error);
                alert("Не удалось выйти из системы");
            });
        };

        // --- Функция записи в облако (ваша оригинальная) ---
        window.sendToCloud = async function(data) {
            if (!auth.currentUser) return; 
            try {
                // Убедитесь, что myDataRef правильно инициализирован в вашем реальном коде
                // await setDoc(myDataRef, data); 
                console.log("✅ Синхронизировано/Поставлено в очередь Firebase");
            } catch (e) { 
                console.error("Ошибка сохранения: ", e); 
            }
        };
    </script>
</body>
</html>
