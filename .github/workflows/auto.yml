name: Keep 18gps
on:
  workflow_dispatch:
  schedule:
    - cron: '*/6 * * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check trigger type
        run: |
          echo "📅 Trigger event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ AUTOMATIC RUN (cron)"
          else
            echo "👤 MANUAL RUN"
          fi
      
      - name: Ping
        run: |
          echo "🔄 Pinging 18gps.net..."
          echo "=== Request 1 ==="
          curl -s "https://18gps.net/TrackService.aspx?method=getUserAndGPSInfoUtc&school_id=43232166-6084-a2a5-d100-24a41458b0bd&custid=43232166-6084-a2a5-d100-24a41458b0bd&mds=40df44c809d7422299cce4271e61b5fa&mapType=GOOGLE"
          echo ""
          echo "=== Request 2 ==="
          curl -s "https://18gps.net/TrackService.aspx?method=getUserAndGPSInfoUtc&school_id=43232166-a7d1-40a5-d100-5db4383c33ab&custid=43232166-a7d1-40a5-d100-5db4383c33ab&mds=ccd67b5238684f439829cfce89995901&mapType=GOOGLE"
          echo ""
          echo "✅ Ping completed!"