name: Keep 18gps Session

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Увеличили до 15 минут
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Включаем кэш

      - name: Install dependencies
        run: |
          npm ci --only=production  # Быстрее чем npm install

      - name: Run browser automation
        run: node keep-alive.js
        env:
          URL_1: ${{ secrets.URL_1 }}
          URL_2: ${{ secrets.URL_2 }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 3